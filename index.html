<title>Yahya Debbagh · Portfolio</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<style>
/* Layout idea: a technical drawing sheet. Ink-navy paper with a faint grid, safety-orange for what matters, sections labelled like drawing views, a title-block footer. */
:root{
  --ink:#0A111E;        /* page */
  --panel:#101A2B;      /* cards */
  --line:#223250;       /* hairlines, grid */
  --text:#E7ECF3;
  --muted:#8E9AB0;
  --accent:#FF7A1A;     /* safety orange */
  --data:#5CC6EE;       /* measurements */
  --display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --card:rgba(16,26,43,.82); --card-solid:#0F1828; --sub:#17243a; --track:#1b2a44; --ph1:#121d31; --ph2:#0f1828;
  --line-hi:#36507a; --star-line:#5a3a1c; --text2:#C3CBD8; --text3:#D3DAE5; --tag-text:#B9C6DA;
  --nav:rgba(10,17,30,.86); --veil1:rgba(10,17,30,.55); --veil2:rgba(10,17,30,.92); --count-bg:rgba(10,17,30,.82);
  --chip-hover:rgba(24,38,62,.95); --shadow:rgba(0,0,0,.35); --shadow2:rgba(0,0,0,.4); --shadow3:rgba(0,0,0,.5);
  --backdrop:rgba(4,8,15,.78); --mn1:#16233a; --mn2:#0f1a2c; --on-accent:#1a0d02;
  color-scheme:dark;
}
html[data-theme="light"]{
  --ink:#F3F6FA; --panel:#FFFFFF; --line:#D6DEE9; --text:#14202F; --muted:#556780; --accent:#D9540A; --data:#0B79A8;
  --card:rgba(255,255,255,.9); --card-solid:#FFFFFF; --sub:#EDF2F8; --track:#DCE5EF; --ph1:#E8EEF5; --ph2:#DFE7F0;
  --line-hi:#9DB1CB; --star-line:#E8B98D; --text2:#33445A; --text3:#2A3A4F; --tag-text:#3A4E68;
  --nav:rgba(243,246,250,.88); --veil1:rgba(243,246,250,.55); --veil2:rgba(243,246,250,.93); --count-bg:rgba(255,255,255,.92);
  --chip-hover:#FFFFFF; --shadow:rgba(30,50,90,.14); --shadow2:rgba(30,50,90,.18); --shadow3:rgba(30,50,90,.28);
  --backdrop:rgba(20,32,50,.5); --mn1:#E8EEF6; --mn2:#DCE5F0; --on-accent:#FFFFFF;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{
  margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,var(--veil1),var(--veil2) 70%);pointer-events:none;z-index:0}
main,header,footer{position:relative;z-index:1}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}

/* NAV */
.nav{position:sticky;top:0;z-index:20;background:var(--nav);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:18px;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand i{width:10px;height:10px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
.links{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.links a{text-decoration:none;color:var(--muted);font-size:14px;padding:8px 10px;border-radius:6px;white-space:nowrap}
.links a:hover{color:var(--text);background:var(--panel)}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-shrink:0}
.lang button{background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:12px;padding:7px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--body);font-weight:600;font-size:15px;padding:12px 20px;border-radius:8px;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-ghost{border-color:var(--line);background:var(--card);color:var(--text)}
.btn-ghost:hover{border-color:var(--muted)}
.nav .btn{padding:8px 14px;font-size:14px;flex-shrink:0}
@media (max-width:860px){.links{display:none}.lang{margin-left:auto}}

/* HERO */
.hero{padding:72px 0 40px}
.hero-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:56px;align-items:center}
.hero .mono b{color:var(--accent);font-weight:500}
.hero h1{font-size:clamp(44px,7vw,88px);font-stretch:118%;font-weight:850;letter-spacing:-.02em;margin:14px 0 18px}
.hero h1 span{display:block;color:var(--accent)}
.hero .role{font-size:19px;font-weight:500;margin:0 0 12px}
.hero .intro{color:var(--muted);max-width:56ch;margin:0 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.portrait{position:relative;width:122%;margin-left:-14%;isolation:isolate}
.portrait img{position:relative;z-index:1;display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;-webkit-mask-image:linear-gradient(to bottom,#000 64%,transparent 99%);mask-image:linear-gradient(to bottom,#000 64%,transparent 99%);filter:drop-shadow(0 24px 40px var(--shadow3)) saturate(1.02) contrast(1.04)}
.portrait::before{content:"";position:absolute;z-index:0;left:8%;right:8%;top:4%;bottom:14%;border-radius:50%;background:radial-gradient(circle at 50% 42%,rgba(255,122,26,.32),rgba(255,122,26,0) 66%)}
.ring{position:absolute;z-index:0;left:50%;top:43%;width:80%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(92,198,238,.30)}
.ring.r2{width:100%;border:1px dashed rgba(255,122,26,.28);animation:spin 70s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.portrait .dim{left:22%;right:22%;bottom:6px;z-index:2}
.dim{position:absolute;left:18px;right:18px;bottom:-14px;display:flex;align-items:center;gap:8px;color:var(--data);font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.dim::before,.dim::after{content:"";flex:1;height:1px;background:var(--data);opacity:.6}
.dim-v{position:absolute;top:18px;bottom:18px;right:-6px;writing-mode:vertical-rl;display:flex;align-items:center;gap:8px;color:var(--data);font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.dim-v::before,.dim-v::after{content:"";flex:1;width:1px;background:var(--data);opacity:.6}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr;gap:36px}.portrait{width:100%;margin:0 auto;max-width:400px}.hero{padding-top:44px}}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);margin-top:56px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.kpi{padding:20px 22px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi strong{display:block;font-family:var(--display);font-stretch:110%;font-size:32px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi strong em{font-style:normal;color:var(--accent)}
.kpi strong span{font-size:inherit;color:inherit}
.kpi span{font-size:13px;color:var(--muted)}
@media (max-width:760px){.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}

.tools{margin-top:28px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:12px;width:max-content;animation:slide 55s linear infinite}
.ti{display:block;width:22px;height:22px;flex:none}.ti svg{display:block;width:100%;height:100%}
.chip:hover{border-color:var(--line-hi);background:var(--chip-hover)}
.tools:hover .track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.chip{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13px;padding:9px 16px 9px 12px;border:1px solid var(--line);border-radius:999px;color:var(--text);background:var(--card);white-space:nowrap}

/* SECTIONS */
section{padding:72px 0;scroll-margin-top:-64px}
.sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:36px}
.sec-no{font-family:var(--mono);font-size:13px;color:var(--accent)}
.sec-head h2{font-size:clamp(30px,4vw,44px);font-stretch:112%;font-weight:800;letter-spacing:-.01em}
.sec-rule{flex:1;height:1px;background:var(--line);align-self:center}
.lead{color:var(--muted);max-width:65ch;margin:-16px 0 32px}

/* ABOUT */
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:48px}
.about p{margin:0 0 16px;max-width:62ch}
.about p:first-child{font-size:20px;color:var(--text);font-weight:500;line-height:1.45}
.about .txt p:not(:first-child){color:var(--text2)}
.facts{display:grid;gap:12px;align-content:start}
.fact{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--card)}
.fact .mono{margin-bottom:6px;display:block}
.fact div{font-weight:500}
@media (max-width:860px){.about{grid-template-columns:1fr}}

/* EXPERIENCE */
.xp-list{display:grid;gap:16px}
.xp{display:grid;grid-template-columns:230px 1fr auto;gap:28px;align-items:start;text-align:left;width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 28px;cursor:pointer;position:relative;transition:border-color .2s,transform .2s}
.xp::before{content:"";position:absolute;left:-1px;top:24px;bottom:24px;width:3px;background:var(--accent);border-radius:0 3px 3px 0;opacity:0;transition:opacity .2s}
.xp:hover{border-color:var(--line-hi);transform:translateY(-2px)}
.xp:hover::before{opacity:1}
.xp .when{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.xp .when b{color:var(--data);font-weight:500}
.xp-img{border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:var(--ph1)}
.xp-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.xp:hover .xp-img img{transform:scale(1.03)}
.xp h3{font-size:22px;font-stretch:105%;font-weight:700;margin-bottom:4px}
.xp .co{color:var(--accent);font-weight:500;font-size:15px;margin-bottom:10px}
.xp p{margin:0 0 14px;color:var(--text2);max-width:64ch}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--mono);font-size:11.5px;padding:4px 9px;border-radius:4px;background:var(--sub);color:var(--tag-text);border:1px solid var(--line)}
.xp .more{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.xp:hover .more{color:var(--accent)}
.xp .result{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 14px}
.xp .result div{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.xp .result b{font-family:var(--display);font-stretch:110%;font-size:22px;color:var(--text);font-weight:800;margin-right:6px}
@media (max-width:760px){.xp{grid-template-columns:1fr;gap:14px;padding:18px}.xp-img{aspect-ratio:16/9}.xp .more{justify-self:start}}

/* SKILLS */
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.skill{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:var(--card)}
.skill h3{font-size:17px;font-stretch:105%;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.skill h3 i{width:8px;height:8px;background:var(--accent);transform:rotate(45deg);flex-shrink:0}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.lng{border:1px solid var(--line);border-radius:12px;padding:18px 22px;background:var(--card)}
.lng b{font-family:var(--display);font-size:18px;font-weight:700}
.lng .mono{display:block;margin-top:4px}
.bar{height:4px;background:var(--track);border-radius:4px;margin-top:12px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--data)}
@media (max-width:860px){.skills{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.skills,.langs{grid-template-columns:1fr}}

/* EDUCATION */
.edu-grid{display:grid;grid-template-columns:1fr;gap:52px}
.timeline{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.step{display:flex;flex-direction:column;gap:16px;border:1px solid var(--line);border-radius:14px;padding:22px;background:var(--card);transition:transform .25s,border-color .25s,box-shadow .25s}
.step:hover{transform:translateY(-3px);border-color:var(--line-hi);box-shadow:0 12px 30px var(--shadow)}
.sl{position:relative;width:132px;height:76px;flex:none;border-radius:10px;background:#fff;border:1px solid var(--line)}
.sl img{position:absolute;left:10px;top:6px;width:calc(100% - 20px);height:calc(100% - 12px);object-fit:contain}
.sl.full{width:106px;overflow:hidden}.sl.full img{left:0;top:0;width:100%;height:100%;object-fit:cover}
.sl.mn{display:grid;place-items:center;background:linear-gradient(135deg,var(--mn1),var(--mn2));color:var(--data);font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.04em}
.step.main{grid-column:1/-1;flex-direction:row;align-items:center;gap:32px;padding:30px 34px;border-color:var(--star-line);background:linear-gradient(135deg,rgba(255,122,26,.12),var(--card) 62%)}
.step.main .sl{width:200px;height:118px}
.step.main h3{font-size:28px;margin:6px 0 6px}
.step.main .st>div{font-size:17px}
.step.main .mono{font-size:13px}
.step .mono{color:var(--data)}
.step h3{font-size:19px;font-weight:700;line-height:1.3;margin:4px 0 4px}
.step .st>div{color:var(--muted);font-size:15px}
.h-sub{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
.certs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cert{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--card)}
a.cert{text-decoration:none;color:inherit;cursor:pointer}
.cert .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cert .pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;line-height:1;padding:6px 11px 6px 8px;border-radius:999px;border:1px solid rgba(92,198,238,.35);background:rgba(92,198,238,.08);color:var(--data)}
.cert .ci{display:block;width:15px;height:15px;flex:none}.cert .ci svg{display:block;width:100%;height:100%}
.cert .yr{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.cert b{font-weight:700;font-size:17px;line-height:1.35}
.cert .by{font-size:14px;color:var(--data)}
.cert .cv{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:auto;padding-top:6px;letter-spacing:.02em}
.cert:hover .cv{color:var(--accent)}
.cert:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cert.star{border-color:var(--star-line);background:linear-gradient(135deg,rgba(255,122,26,.10),var(--card) 60%)}
@media (max-width:980px){.timeline,.certs{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.timeline,.certs{grid-template-columns:1fr}.step.main{flex-direction:column;align-items:flex-start;gap:16px;padding:22px}.step.main .sl{width:160px;height:94px}.step.main h3{font-size:22px}}

/* ACTIVITIES */
.act-group{margin-bottom:40px}
.act-group:last-child{margin-bottom:0}
.act-group .h-sub{display:flex;align-items:center;gap:12px}
.act-group .h-sub::after{content:"";flex:1;height:1px;background:var(--line)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.ph{position:relative}
.count{position:absolute;right:10px;bottom:10px;font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:4px;background:var(--count-bg);color:var(--text);border:1px solid var(--line)}
.gallery button{padding:0;border:0;background:none;cursor:zoom-in;display:block;width:100%}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);transition:opacity .15s}
.gallery button:hover img{opacity:.85}
#viewer{width:auto;max-width:calc(100vw - 32px);background:#05080f;border-color:#2a3a58}
#viewer img{max-width:calc(100vw - 32px);max-height:calc(100vh - 120px);width:auto;height:auto;margin:0 auto}
.v-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.v-bar button{background:none;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
.v-bar button:hover{border-color:var(--accent);color:var(--accent)}
.v-bar .sp{flex:1;text-align:center}
@media (max-width:960px){.acts{grid-template-columns:repeat(2,1fr)}}
.act{text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .2s}
.act:hover{border-color:var(--line-hi);transform:translateY(-2px)}
.ph{aspect-ratio:16/9;display:grid;place-items:center;background:repeating-linear-gradient(45deg,var(--ph1) 0 10px,var(--ph2) 10px 20px);border-bottom:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.act-body{padding:20px 22px}
.act h3{font-size:19px;font-weight:700;margin:6px 0 6px}
.act p{margin:0;color:var(--text2);font-size:15px}
@media (max-width:700px){.acts{grid-template-columns:1fr}}

/* CONTACT */
.contact{display:grid;grid-template-columns:1fr 1.2fr;gap:40px}
.contact h3{font-size:30px;font-stretch:112%;font-weight:800;margin-bottom:12px}
.contact p{color:var(--muted);margin:0 0 24px;max-width:46ch}
.ways{display:grid;gap:10px}
.way{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card);text-decoration:none}
.way .mono{width:78px;flex-shrink:0}
.way span:last-child{font-weight:500;word-break:break-all}
form{border:1px solid var(--line);border-radius:12px;padding:24px;background:var(--card);display:grid;gap:14px}
label{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:grid;gap:6px}
input,textarea{font:inherit;font-size:15px;text-transform:none;letter-spacing:0;color:var(--text);background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:120px;resize:vertical}
.form-note{font-size:14px;color:var(--data);min-height:1.2em;margin:0}
@media (max-width:860px){.contact{grid-template-columns:1fr}}

/* FOOTER title block */
footer{padding:8px 0 40px;border-top:1px solid var(--line)}
.foot{margin:24px 0 0;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}

/* MODAL */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card-solid);color:var(--text);padding:0;width:min(860px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:var(--backdrop);backdrop-filter:blur(3px)}
dialog[open]{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(12px)}}
.m-head{position:sticky;top:0;background:var(--card-solid);border-bottom:1px solid var(--line);padding:24px 28px 20px;display:flex;gap:16px;align-items:flex-start;z-index:2}
.m-head h3{font-size:clamp(22px,3vw,28px);font-stretch:108%;font-weight:800}
.m-head .mono{color:var(--data);margin-top:8px;display:block}
.m-head .subj{color:var(--accent);font-weight:500;margin-top:6px}
.x{margin-left:auto;background:none;border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:20px;line-height:1;flex-shrink:0}
.x:hover{border-color:var(--accent);color:var(--accent)}
.m-body{padding:24px 28px 30px}
.m-body h4{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:26px 0 12px}
.m-body h4:first-child{margin-top:0}
.m-body ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.m-body li{position:relative;padding-left:22px;color:var(--text3)}
.m-body li::before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;background:var(--accent);transform:rotate(45deg)}
.m-body p{color:var(--text3);margin:0}
.dmaic{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.dmaic div{background:var(--sub);border:1px solid var(--line);padding:10px 8px;text-align:center;border-radius:4px}
.dmaic div:first-child{border-radius:8px 4px 4px 8px}
.dmaic b{display:block;font-family:var(--display);font-size:22px;color:var(--accent);font-weight:800}
.dmaic span{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ba-card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--ph1)}
.ba-card .mono{display:block;margin-bottom:10px}
.ba-row{display:grid;grid-template-columns:60px 1fr 64px;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
.ba-row .track2{height:10px;background:var(--track);border-radius:3px;overflow:hidden}
.ba-row .track2 span{display:block;height:100%;border-radius:3px}
.ba-row b{color:var(--text);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.ba-delta{margin-top:10px;font-family:var(--display);font-weight:800;font-size:20px;color:var(--data)}
@media (max-width:620px){.ba{grid-template-columns:1fr}.dmaic span{font-size:10px}}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gallery .ph{border:1px solid var(--line);border-radius:8px;aspect-ratio:4/3}
.cv-img{border-radius:6px;background:#fff;width:100%}

html{overflow-anchor:none}
/* THEME */
.theme{display:grid;place-items:center;width:36px;height:34px;flex-shrink:0;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);cursor:pointer;padding:0;transition:border-color .2s,color .2s}
.theme:hover{border-color:var(--accent);color:var(--accent)}
.theme svg{width:18px;height:18px;display:block}
html[data-theme="light"] .theme .i-sun{display:none}
html:not([data-theme="light"]) .theme .i-moon{display:none}
html[data-theme="light"] .ti svg[style*="5CC6EE"]{color:#0B79A8;stroke:#0B79A8}
html[data-theme="light"] .ti svg[style*="FF7A1A"]{color:#D9540A;stroke:#D9540A}
html.tt body,html.tt body *{transition:background-color .35s,border-color .35s,color .35s,box-shadow .35s!important}
.brand{white-space:nowrap}
@media (max-width:520px){.nav .wrap{gap:8px;padding:0 14px}.brand{font-size:14px}.lang button{padding:7px 8px}.nav .btn{padding:8px 11px;font-size:13px}.theme{width:34px}}
/* ANIMATIONS */
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(40px,-30px,0) scale(1.1)}}
@keyframes draw{from{width:0;height:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,122,26,.55)}100%{box-shadow:0 0 0 12px rgba(255,122,26,0)}}
@keyframes fade{from{opacity:0}}
#progress{position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,var(--accent),var(--data));transform-origin:0 50%;transform:scaleX(0);z-index:30;pointer-events:none}
.links a.active{color:var(--text);background:var(--panel);box-shadow:inset 0 -2px 0 var(--accent)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px;animation:pulse 2s ease-out infinite}
.hero{position:relative;overflow:clip}
.hero .wrap{position:relative;z-index:1}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none;filter:blur(10px)}
.hero::before{top:-100px;right:-100px;width:620px;height:620px;background:radial-gradient(circle,rgba(255,122,26,.17),transparent 65%);animation:drift 14s ease-in-out infinite}
.hero::after{left:-160px;bottom:-80px;width:520px;height:520px;background:radial-gradient(circle,rgba(92,198,238,.13),transparent 65%);animation:drift 18s ease-in-out infinite reverse}
.portrait img,.portrait .ring,.portrait::before{transition:transform .35s ease-out}
.btn-primary:hover{box-shadow:0 8px 26px rgba(255,122,26,.38)}
.js .hero.play .hero-grid>div:first-child>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}
.js .hero.play .hero-grid>div:first-child>:nth-child(1){animation-delay:.05s}
.js .hero.play .hero-grid>div:first-child>:nth-child(2){animation-delay:.16s}
.js .hero.play .hero-grid>div:first-child>:nth-child(3){animation-delay:.3s}
.js .hero.play .hero-grid>div:first-child>:nth-child(4){animation-delay:.42s}
.js .hero.play .hero-grid>div:first-child>:nth-child(5){animation-delay:.56s}
.js .hero.play .portrait{animation:rise 1.1s .2s cubic-bezier(.2,.7,.2,1) backwards}
.js .hero.play .kpis{animation:rise .9s .75s cubic-bezier(.2,.7,.2,1) backwards}
.js .hero.play .tools{animation:rise .9s .95s cubic-bezier(.2,.7,.2,1) backwards}
.js .rv{opacity:0}
.js .rv.in{opacity:1;animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*80ms)}
.lng.in .bar span{animation:grow 1.3s .4s cubic-bezier(.2,.7,.2,1) backwards}
.skill,.cert,.fact,.way,.lng{transition:transform .25s,border-color .25s,box-shadow .25s}
.skill:hover,.cert:hover,.fact:hover,.way:hover,.lng:hover{transform:translateY(-3px);border-color:var(--line-hi);box-shadow:0 12px 30px var(--shadow)}
.xp,.act{transition:border-color .2s,transform .2s,box-shadow .25s}
.xp:hover,.act:hover{box-shadow:0 14px 34px var(--shadow2)}
.act .ph{overflow:hidden}
.act .ph img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.act:hover .ph img{transform:scale(1.06)}
dialog::backdrop{animation:fade .25s}
dialog[open] .m-body li{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms + 180ms)}
dialog[open] .dmaic div{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*90ms + 120ms)}
dialog[open] .ba-row .track2 span{animation:grow 1.1s .45s cubic-bezier(.2,.7,.2,1) backwards}
dialog[open] .gallery button{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*90ms + 250ms)}
@media print{.js .rv{opacity:1}}

function openXP(id){
  const x = XP.find(e=>e.id===id), t = T[lang];
  let b = "";
  if(x.dmaic) b += `<h4>${t.m_dmaic}</h4><div class="dmaic">${x.dmaic[lang].map((s,i)=>`<div style="--i:${i}"><b>${s[0]}</b><span>${esc(s)}</span></div>`).join("")}</div>`;
  b += `<h4>${t.m_miss}</h4>${list(L(x.miss))}`;
  if(x.ba){
    const n = lang==="en" ? (v=>v.replace(",",".")) : (v=>v);
    b += `<h4>${t.m_res}</h4><div class="ba">
      <div class="ba-card"><span class="mono">${lang==="fr"?"Taux de rebut":"Scrap rate"}</span>
        <div class="ba-row"><span>${t.before}</span><div class="track2"><span style="width:100%;background:#8E9AB0"></span></div><b>${n("4,09")} %</b></div>
        <div class="ba-row"><span>${t.after}</span><div class="track2"><span style="width:${(2.6/4.09*100).toFixed(1)}%;background:var(--accent)"></span></div><b>${n("2,6")} %</b></div>
        <div class="ba-delta">−36 %</div></div>
      <div class="ba-card"><span class="mono">${lang==="fr"?"Criticité AMDEC":"FMEA criticality (RPN)"}</span>
        <div class="ba-row"><span>${t.before}</span><div class="track2"><span style="width:100%;background:#8E9AB0"></span></div><b>224</b></div>
        <div class="ba-row"><span>${t.after}</span><div class="track2"><span style="width:${(48/224*100).toFixed(1)}%;background:var(--accent)"></span></div><b>48</b></div>
        <div class="ba-delta">−79 %</div></div>
    </div>`;
  } else if(x.res){
    b += `<h4>${t.m_res}</h4>${list(L(x.res))}`;
  }
  b += `<h4>${t.m_skills}</h4>${tagsHTML(x.tags)}`;
  if(x.photos){ vList = x.photos; b += `<h4>${t.m_photos}</h4><div class="gallery">${galleryHTML(x.photos)}</div>`; }
  openModal(`${L(x.title)} · ${x.co.split(" · ")[0]}`, `${L(x.type)} · ${L(x.when)} · ${x.co.split(" · ")[1]}`, L(x.subj), b);
}

$("v-prev").addEventListener("click", ()=>{ vIdx=(vIdx-1+vList.length)%vList.length; showPhoto(); });
$("v-next").addEventListener("click", ()=>{ vIdx=(vIdx+1)%vList.length; showPhoto(); });
viewer.addEventListener("click", e=>{ if(e.target===viewer) viewer.close(); });

modal.addEventListener("click", e=>{ if(e.target===modal) modal.close(); });

$("form").addEventListener("submit", e=>{
  e.preventDefault();
  const n=$("f-name").value.trim(), m=$("f-mail").value.trim(), msg=$("f-msg").value.trim();
  if(!n || !msg || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){ $("form-note").textContent = T[lang].f_err; return; }
  const subject = encodeURIComponent(`Portfolio · ${n}`);
  const body = encodeURIComponent(`${msg}\n\n${n} · ${m}`);
  $("form-note").textContent = T[lang].f_ok;
  try{ window.location.href = `mailto:yahyadebbagh20@gmail.com?subject=${subject}&body=${body}`; }catch(err){}
});

/* ANIMATIONS */
const ANIM = document.documentElement.classList.contains("js");
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const REVEAL = ".sec-head,.lead,#about-txt p,.fact,.xp,.skill,.lng,.step,.cert,.h-sub,.act,.contact h3,.contact p,.way,#form";
let firstRender = true;
const io = ANIM ? new IntersectionObserver(es=>es.forEach(e=>{
  const el=e.target;
  if(e.isIntersecting && e.intersectionRatio>=.12){ if(!el.classList.contains("in")){ el.style.animation=""; el.classList.add("in"); } }
  else if(!e.isIntersecting){ el.classList.remove("in"); el.style.animation=""; }   // hors écran : on réarme, l'animation rejoue au prochain passage
}),{threshold:[0,.12],rootMargin:"0px 0px -6% 0px"}) : null;
function setupReveal(){
  if(!ANIM) return;
  document.querySelectorAll(REVEAL).forEach(el=>{
    if(el.dataset.o) return; el.dataset.o="1"; el.classList.add("rv");
    const sib=[...el.parentElement.children].filter(c=>c.matches(REVEAL));
    el.style.setProperty("--i", Math.min(sib.indexOf(el),5));
    if(!firstRender && el.getBoundingClientRect().top < innerHeight){ el.style.animation="none"; el.classList.add("in"); }
    io.observe(el);
  });
}
let countRun=0;
function countUp(delay=0){
  if(!ANIM || REDUCE) return;
  const run=++countRun;
  document.querySelectorAll("[data-count]").forEach(el=>{
    const to=+el.dataset.count; el.textContent="0";
    const t0=performance.now()+delay, dur=1500;
    const tick=now=>{ if(run!==countRun) return; const u=Math.max(0,Math.min(1,(now-t0)/dur)); el.textContent=Math.round(to*(1-Math.pow(1-u,3))); if(u<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
const _render = render;
render = function(){ _render(); setupReveal(); if(firstRender){ countUp(900); firstRender=false; } else countUp(0); };

/* Hero : l'entrée (texte, photo, chiffres, bandeau) rejoue à chaque retour en haut de page */
const heroEl=document.querySelector(".hero");
if(ANIM){
  heroEl.classList.add("play");
  new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting && e.intersectionRatio>=.35){ if(!heroEl.classList.contains("play")){ heroEl.classList.add("play"); countUp(700); } }
    else if(!e.isIntersecting){ heroEl.classList.remove("play"); }
  }),{threshold:[0,.35]}).observe(heroEl);
}

const prog=$("progress"), spy=[...document.querySelectorAll(".links a")], spyIds=spy.map(a=>a.getAttribute("href").slice(1));
let ticking=false;
function onScroll(){
  if(ticking) return; ticking=true;
  requestAnimationFrame(()=>{
    const h=document.documentElement.scrollHeight-innerHeight;
    prog.style.transform=`scaleX(${h>0?Math.min(1,scrollY/h):0})`;
    let cur=""; spyIds.forEach(id=>{ const e=document.getElementById(id); if(e && e.getBoundingClientRect().top<=140) cur=id; });
    spy.forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+cur));
    ticking=false;
  });
}
addEventListener("scroll",onScroll,{passive:true}); onScroll();

const portrait=document.querySelector(".portrait");
if(portrait && !REDUCE && matchMedia("(pointer:fine)").matches){
  const pimg=portrait.querySelector("img");
  document.querySelector(".hero").addEventListener("pointermove",e=>{ const r=portrait.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5; pimg.style.transform=`translate(${(x*14).toFixed(1)}px,${(y*8).toFixed(1)}px)`; portrait.style.setProperty("--gx",(x*-18).toFixed(1)+"px"); portrait.querySelectorAll(".ring").forEach(r=>{r.style.marginLeft=(x*-22).toFixed(1)+"px";r.style.marginTop=(y*-12).toFixed(1)+"px";}); });
  document.querySelector(".hero").addEventListener("pointerleave",()=>{ pimg.style.transform=""; portrait.querySelectorAll(".ring").forEach(r=>{r.style.marginLeft="";r.style.marginTop="";}); });
}

/* THEME */
$("theme").addEventListener("click",()=>{
  const root=document.documentElement, next=root.getAttribute("data-theme")==="light"?"dark":"light";
  root.classList.add("tt"); root.setAttribute("data-theme",next);
  try{localStorage.setItem("yd-theme",next)}catch(e){}
  const th=$("theme"); th.setAttribute("aria-label", next==="light"?T[lang].to_dark:T[lang].to_light); th.title=th.getAttribute("aria-label");
  setTimeout(()=>root.classList.remove("tt"),450);
});

render();
</script>
